services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py setup_scrape_schedule &&
             gunicorn MaxDiscoverHub.wsgi:application --bind 0.0.0.0:2001 --workers 3 --timeout 120"
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DEBUG: "False"
      DJANGO_ENV: production
    depends_on:
      - redis
    expose:
      - "2001"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2001/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  release:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py tailwind build &&
             python manage.py collectstatic --noinput"
    restart: "no"
    profiles:
      - release
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DEBUG: "False"
      DJANGO_ENV: production
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media

  celery:
    build: .
    command: celery -A MaxDiscoverHub worker -l info --concurrency=2
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DEBUG: "False"
      DJANGO_ENV: production
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media:/app/media

  celery-beat:
    build: .
    command: celery -A MaxDiscoverHub beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DEBUG: "False"
      DJANGO_ENV: production
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      - web

volumes:
  staticfiles:
  media:
  redis_data:
